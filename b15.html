<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Tienda B15 — Registro de Ventas</title>
<link rel="icon" href="logopeq.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{ --accent:#ea580c; --accent-2:#f97316; --muted:#6b7280; --card:#fff; }
  html,body{ height:100%; margin:0; font-family:'Poppins',sans-serif; background: linear-gradient(180deg,#fff7f0 0%,#f7fbff 100%); color:#0f172a; }
  .wrap{ max-width:1100px; margin:26px auto; padding:14px; }
  header{ display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  header img{ height:44px; }
  .title{ font-weight:600; color:var(--accent); font-size:20px; }
  .layout{ display:grid; grid-template-columns:1fr 420px; gap:18px; }
  .card{ background:var(--card); border-radius:12px; padding:14px; box-shadow:0 10px 24px rgba(15,23,42,0.06); }
  .grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  label{ display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
  input, select, textarea{ width:100%; padding:10px; border-radius:8px; border:1px solid #eef2f6; box-sizing:border-box; font-size:14px; }
  .full{ grid-column:1 / -1; }
  .actions{ display:flex; gap:8px; margin-top:12px; }
  .btn{ background:var(--accent); color:#fff; padding:10px 12px; border-radius:8px; border:none; cursor:pointer; font-weight:600; }
  .btn.ghost{ background:transparent; border:1px solid rgba(15,23,42,0.06); color:#0f172a; }
  .small-btn{ background:var(--accent-2); color:#fff; padding:8px 10px; border-radius:8px; border:none; cursor:pointer; }
  .table-wrap{ max-height:520px; overflow:auto; margin-top:12px; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th,td{ padding:10px 8px; border-bottom:1px solid #f1f5f9; text-align:left; vertical-align:middle; }
  th{ background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#fff; position:sticky; top:0; }
  .hidden{ display:none!important; }
  .msg{ padding:8px 10px; border-radius:8px; margin-bottom:10px; display:none; }
  .msg.success{ background:#ecfccb; color:#14532d; }
  .msg.error{ background:#fee2e2; color:#7f1d1d; }
  @media (max-width:980px){ .layout{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="logopeq.png" alt="logo">
    <div class="title">Tienda <span id="storeLabel">B15</span></div>
  </header>

  <div class="layout">
    <div class="card">
      <div id="msg" class="msg"></div>

      <form id="formVenta" onsubmit="return false;">
        <div class="grid">
          <div>
            <label>Fecha</label>
            <input type="date" id="fecha" required />
          </div>

          <div>
            <label>Cashea</label>
            <select id="cashea"><option value="true">Sí</option><option value="false">No</option></select>
          </div>

          <div class="full">
            <label>Nro. Factura Fiscal / Manual</label>
            <input id="nroFiscal" type="text" placeholder="Opcional" />
          </div>

          <div class="full">
            <label>Nro. Factura Profit</label>
            <input id="nroProfit" type="text" placeholder="Opcional" />
          </div>

          <div>
            <label>Cédula</label>
            <div style="display:flex;gap:8px;">
              <select id="tipoCedula" style="width:110px;"><option>V</option><option>E</option><option>J</option></select>
              <input id="cedula" type="text" placeholder="Número" />
            </div>
          </div>

          <div>
            <label>Cliente *</label>
            <input id="cliente" type="text" placeholder="Nombre del cliente" />
          </div>

          <div>
            <label>Teléfono *</label>
            <input id="telefono" type="tel" placeholder="Ej: 04141234567" />
          </div>

          <div class="full">
            <label>Concepto</label>
            <input id="concepto" type="text" />
          </div>

          <div>
            <label>Orden Recepción</label>
            <input id="ordenRecepcion" type="text" placeholder="#12345" />
          </div>

          <div>
            <label>Vendedor</label>
            <input id="vendedor" type="text" />
          </div>

          <div>
            <label>Técnico</label>
            <input id="tecnico" type="text" />
          </div>

          <div>
            <label>Mano de obra ($)</label>
            <input id="manoObraUsd" type="number" step="0.01" min="0" value="0" />
          </div>

          <div>
            <label>Tipo de pago</label>
            <select id="tipoPago">
              <option>PMF</option><option>PMB</option><option>PUNTO</option>
              <option>EFECTIVO</option><option>ZELLE</option><option>BINANCE</option>
            </select>
          </div>

          <div>
            <label>Lote punto venta</label>
            <input id="lotePuntoVenta" type="text" />
          </div>

          <div id="bsFields">
            <div>
              <label>Tasa BCV</label>
              <input id="tasa" type="number" step="0.01" min="0" />
            </div>
            <div style="display:flex;gap:8px;align-items:end;">
              <div style="flex:1">
                <label>Total (Bs)</label>
                <input id="totalBs" type="number" step="0.01" min="0" />
              </div>
              <div style="width:120px;">
                <button id="btnCalcUsd" type="button" class="small-btn">Calcular</button>
              </div>
            </div>
          </div>

          <div>
            <label>Monto $ *</label>
            <input id="montoUsd" type="number" step="0.01" min="0" placeholder="Ej: 35.00" />
          </div>

          <div class="full">
            <label>Comentarios</label>
            <textarea id="comentarios" rows="2"></textarea>
          </div>

          <div class="full actions">
            <button id="btnGuardar" class="btn">Guardar</button>
            <button id="btnExport" type="button" class="btn ghost">Exportar</button>
            <button id="btnExportHoy" type="button" class="btn ghost">Exportar hoy</button>
            <button id="btnLimpiar" type="button" class="btn ghost">Limpiar</button>
          </div>
        </div>
      </form>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <div style="font-weight:600">Mis ventas</div>
        <div id="countLabel" style="color:var(--muted)">0</div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Fecha</th><th>Factura</th><th>Cliente</th><th>Vendedor</th><th>Técnico</th><th>Mano $</th><th>Total $</th><th>Acción</th>
            </tr>
          </thead>
          <tbody id="tablaVentas"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- SheetJS CDN -->
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

<script>
  // Same JS as provided previously for B15 with date-safe behavior and export
  // (The full JS is included above in the administracion.html file section for export; here we reuse the same helper patterns.)
  const SALES_KEY = 'ventas';
  const urlParams = new URLSearchParams(location.search);
  const STORE_PARAM = urlParams.get('store');
  const DEFAULT_STORE = STORE_PARAM || 'B15';
  document.getElementById('storeLabel').textContent = DEFAULT_STORE;
  const $ = id => document.getElementById(id);
  const hasFirebase = (window.firebase && firebase.firestore);
  const db = hasFirebase ? firebase.firestore() : null;
  const auth = hasFirebase ? firebase.auth() : null;
  const DEFAULT_TASA = 1;

  function idGen(){ return Date.now().toString() + '-' + Math.random().toString(36).slice(2,8); }
  function formatMoney(v){ return Number(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }

  function escapeHtml(s = '') {
    return String(s).replace(/[&<>"']/g, function (m) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m];
    });
  }

  function limpiarFormulario() {
    const form = document.getElementById('formVenta');
    if (form) form.reset();
    const hoy = new Date().toISOString().slice(0, 10);
    const fechaEl = document.getElementById('fecha');
    if (fechaEl) fechaEl.value = hoy;
    try { if (typeof handleTipoPagoChange === 'function') handleTipoPagoChange(); } catch(e){ console.warn(e); }
    const montoEl = document.getElementById('montoUsd'); if (montoEl) montoEl.value = '';
  }

  function showMsg(txt, type='success'){ const m=$('msg'); m.className='msg '+(type==='success'?'success':'error'); m.textContent=txt; m.style.display='block'; setTimeout(()=>m.style.display='none',3000); }

  (function init(){
    const hoy = new Date().toISOString().slice(0,10); if (!$('fecha').value) $('fecha').value = hoy;
    (async ()=>{
      if (hasFirebase) {
        try {
          const id = new Date().toISOString().slice(0,10);
          const doc = await db.collection('rates').doc(id).get();
          $('tasa').value = doc.exists ? doc.data().tasa : DEFAULT_TASA;
        } catch(e){ $('tasa').value = DEFAULT_TASA; }
      } else $('tasa').value = DEFAULT_TASA;
    })();
    handleTipoPagoChange();
    cargarTabla();
  })();

  function handleTipoPagoChange(){
    const tipo = $('tipoPago').value;
    const bsVisible = (tipo === 'PMF' || tipo === 'PMB' || tipo === 'PUNTO');
    const bsContainer = $('bsFields');
    if (bsVisible) bsContainer.classList.remove('hidden'); else { bsContainer.classList.add('hidden'); $('totalBs').value=''; $('tasa').value=''; }
  }
  $('tipoPago').addEventListener('change', handleTipoPagoChange);

  $('btnCalcUsd').addEventListener('click', ()=> {
    const totalBs = parseFloat($('totalBs').value||0);
    const tasa = parseFloat($('tasa').value||0) || DEFAULT_TASA;
    if (!totalBs){ showMsg('Ingrese Total Bs', 'error'); return; }
    if (!tasa){ showMsg('Ingrese Tasa', 'error'); return; }
    const usd = +(totalBs / tasa).toFixed(2);
    if (confirm(`Equivalente sugerido: $${usd}. ¿Copiar a Monto $?`)) {
      $('montoUsd').value = usd;
      showMsg('Sugerencia copiada', 'success');
    } else showMsg('Sugerencia: $' + usd, 'success');
  });

  async function guardarVenta(){
    const cliente = $('cliente').value.trim();
    const telefono = $('telefono').value.trim();
    const montoUsd = parseFloat($('montoUsd').value || 0);
    if (!cliente){ showMsg('Cliente obligatorio', 'error'); return; }
    if (!telefono){ showMsg('Teléfono obligatorio', 'error'); return; }
    if (!montoUsd || montoUsd <= 0){ showMsg('Monto $ obligatorio', 'error'); return; }
    let orden = $('ordenRecepcion').value.trim();
    if (orden && !orden.startsWith('#')) orden = '#' + orden;
    const tipo = $('tipoPago').value;
    const enableBs = (tipo==='PMF' || tipo==='PMB' || tipo==='PUNTO');
    const tasa = parseFloat($('tasa').value || DEFAULT_TASA) || DEFAULT_TASA;
    const totalBs = parseFloat($('totalBs').value || 0);
    const manoUsd = parseFloat($('manoObraUsd').value || 0);
    const manoBs = (enableBs && $('tasa').value) ? +(manoUsd * tasa).toFixed(2) : 0;
    const totalBsIncluyeMano = +( (enableBs ? totalBs : 0) + manoBs ).toFixed(2);
    const venta = {
      id: idGen(),
      date: new Date($('fecha').value),
      fecha: $('fecha').value,
      nroFacturaFiscalManual: $('nroFiscal').value.trim() || '',
      nroFacturaProfit: $('nroProfit').value.trim() || '',
      cashea: $('cashea').value === 'true',
      cedulaCliente: ($('tipoCedula').value || '') + '-' + ($('cedula').value || ''),
      cliente: cliente,
      telefonoCliente: telefono,
      concepto: $('concepto').value || '',
      ordenRecepcion: orden || '',
      vendedor: $('vendedor').value || '',
      tecnico: $('tecnico').value || '',
      manoDeObraUsd: manoUsd,
      manoDeObraBs: manoBs,
      tipoPago: tipo,
      lotePuntoVenta: $('lotePuntoVenta').value || '',
      totalBs: enableBs ? totalBs : 0,
      totalBsIncluyeMano: totalBsIncluyeMano,
      tasa: enableBs ? tasa : null,
      montoVentaUsd: +montoUsd.toFixed(2),
      montoUsd: +montoUsd.toFixed(2),
      comentarios: $('comentarios').value || '',
      storeId: DEFAULT_STORE,
      createdAt: new Date().toISOString()
    };
    try {
      if (hasFirebase) {
        if (!firebase.apps || !firebase.apps.length) throw new Error('Firebase no inicializado.');
        if (!auth || !auth.currentUser) throw new Error('No autenticado. Inicia sesión antes de guardar en Firestore.');
        const docRef = await db.collection('sales').add({
          date: firebase.firestore.Timestamp.fromDate(new Date(venta.fecha)),
          nroFacturaFiscalManual: venta.nroFacturaFiscalManual,
          nroFacturaProfit: venta.nroFacturaProfit,
          cashea: venta.cashea,
          cedulaCliente: venta.cedulaCliente,
          cliente: venta.cliente,
          telefonoCliente: venta.telefonoCliente,
          concepto: venta.concepto,
          ordenRecepcion: venta.ordenRecepcion,
          vendedor: venta.vendedor,
          tecnico: venta.tecnico,
          manoDeObraUsd: venta.manoDeObraUsd,
          manoDeObraBs: venta.manoDeObraBs,
          tipoPago: venta.tipoPago,
          lotePuntoVenta: venta.lotePuntoVenta,
          totalBs: venta.totalBs,
          totalBsIncluyeMano: venta.totalBsIncluyeMano,
          tasa: venta.tasa,
          montoVentaUsd: venta.montoVentaUsd,
          montoUsd: venta.montoUsd,
          comentarios: venta.comentarios,
          storeId: venta.storeId,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          createdBy: auth.currentUser ? auth.currentUser.uid : null
        });
        showMsg('Venta guardada', 'success');
      } else {
        const arr = JSON.parse(localStorage.getItem(SALES_KEY) || '[]');
        arr.push(venta);
        localStorage.setItem(SALES_KEY, JSON.stringify(arr));
        showMsg('Venta guardada local', 'success');
      }
      cargarTabla();
      limpiarFormulario();
    } catch (e) {
      console.error('Error al guardar venta:', e);
      alert('Error al guardar la venta: ' + (e.message || e));
    }
  }

  async function cargarTabla(){
    try {
      let ventas = [];
      if (hasFirebase) {
        const q = db.collection('sales').where('storeId','==',DEFAULT_STORE).orderBy('date','desc').limit(500);
        const snap = await q.get();
        ventas = snap.docs.map(doc => {
          const s = doc.data();
          return {
            id: doc.id,
            fecha: s.date ? (s.date.seconds ? new Date(s.date.seconds*1000).toISOString().slice(0,10) : new Date(s.date).toISOString().slice(0,10)) : '',
            nroFiscal: s.nroFacturaFiscalManual || '',
            nroProfit: s.nroFacturaProfit || '',
            cashea: s.cashea || false,
            cedulaCliente: s.cedulaCliente || '',
            cliente: s.cliente || '',
            telefonoCliente: s.telefonoCliente || '',
            concepto: s.concepto || '',
            ordenRecepcion: s.ordenRecepcion || '',
            vendedor: s.vendedor || '',
            tecnico: s.tecnico || '',
            manoDeObraUsd: Number(s.manoDeObraUsd || 0),
            tipoPago: s.tipoPago || '',
            lotePuntoVenta: s.lotePuntoVenta || '',
            totalBs: Number(s.totalBs || 0),
            tasa: s.tasa || null,
            montoVentaUsd: Number(s.montoVentaUsd || s.montoUsd || 0),
            comentarios: s.comentarios || ''
          };
        });
      } else {
        const arr = JSON.parse(localStorage.getItem(SALES_KEY) || '[]');
        ventas = arr.filter(v => v.storeId === DEFAULT_STORE).slice(-500).reverse();
      }

      $('tablaVentas').innerHTML = ventas.map(v => `
        <tr>
          <td>${v.fecha}</td>
          <td>${v.nroFiscal || v.nroProfit || ''}</td>
          <td>${escapeHtml(v.cliente)}</td>
          <td>${escapeHtml(v.vendedor)}</td>
          <td>${escapeHtml(v.tecnico)}</td>
          <td>$${formatMoney(v.manoDeObraUsd)}</td>
          <td>$${formatMoney(v.montoVentaUsd)}</td>
          <td><button data-id="${v.id || v.idGen || ''}" class="btnDel" style="background:#ef4444;border:none;color:#fff;border-radius:6px;padding:6px 8px;cursor:pointer">Eliminar</button></td>
        </tr>
      `).join('');

      Array.from(document.getElementsByClassName('btnDel')).forEach(b=>{
        b.onclick = async () => {
          const id = b.getAttribute('data-id');
          if (!id){ showMsg('Id no disponible', 'error'); return; }
          if (!confirm('Eliminar esta venta? Esta acción no se puede deshacer.')) return;
          try {
            if (hasFirebase) {
              await db.collection('sales').doc(id).delete();
              showMsg('Venta eliminada (Firestore)', 'success');
            } else {
              let arr = JSON.parse(localStorage.getItem(SALES_KEY) || '[]');
              arr = arr.filter(x => x.id !== id);
              localStorage.setItem(SALES_KEY, JSON.stringify(arr));
              showMsg('Venta eliminada (local)', 'success');
            }
            cargarTabla();
          } catch (err) {
            console.error(err);
            showMsg('Error eliminando', 'error');
          }
        };
      });

      $('countLabel').textContent = ventas.length;
    } catch (e) { console.error(e); }
  }

  async function exportAllFiltered(){
    let ventas = [];
    if (hasFirebase) {
      const q = await db.collection('sales').where('storeId','==',DEFAULT_STORE).orderBy('date','desc').limit(10000).get();
      ventas = q.docs.map(d => ({ id: d.id, ...d.data() }));
    } else {
      ventas = JSON.parse(localStorage.getItem(SALES_KEY) || '[]').filter(v => v.storeId === DEFAULT_STORE);
    }
    if (!ventas.length){ showMsg('No hay ventas para exportar', 'error'); return; }
    exportsXLSX.exportVentasXLSX(ventas, { filename: `ventas_${DEFAULT_STORE}_all.xlsx` });
  }

  $('btnExport').addEventListener('click', exportAllFiltered);

  $('btnExportHoy').addEventListener('click', async () => {
    const fecha = $('fecha').value || new Date().toISOString().slice(0,10);
    let ventas = [];
    if (hasFirebase) {
      const start = new Date(fecha); start.setHours(0,0,0,0);
      const end = new Date(fecha); end.setHours(23,59,59,999);
      const q = await db.collection('sales').where('storeId','==',DEFAULT_STORE).where('date','>=', start).where('date','<=', end).get();
      ventas = q.docs.map(d => ({ id: d.id, ...d.data() }));
    } else {
      const arr = JSON.parse(localStorage.getItem(SALES_KEY) || '[]');
      ventas = arr.filter(v => v.storeId === DEFAULT_STORE && (v.fecha === fecha || (v.date && new Date(v.date).toISOString().slice(0,10) === fecha)));
    }
    if (!ventas.length){ showMsg('No hay ventas para esa fecha', 'error'); return; }
    exportsXLSX.exportVentasSingleDay(ventas, fecha, { filename: `ventas_${DEFAULT_STORE}_${fecha}.xlsx` });
  });

  $('btnLimpiar').addEventListener('click', ()=>{ limpiarFormulario(); });

  $('btnGuardar').addEventListener('click', guardarVenta);
</script>
</body>
</html>
