<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Administración — Orange Store</title>
<link rel="icon" href="logopeq.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  body{ font-family:'Poppins',sans-serif; background:#f8fafc; margin:0; padding:20px; color:#0f172a; }
  h1{ color:#ea580c; margin:0 0 12px 0; }
  select,input{ padding:8px; border-radius:6px; border:1px solid #ccc; width:100%; margin:6px 0 10px; }
  table{ width:100%; border-collapse:collapse; margin-top:12px; }
  th,td{ border-bottom:1px solid #e6edf3; padding:8px; font-size:14px; text-align:left; }
  th{ background:#f97316; color:white; position:sticky; top:0; }
  .card{ background:white; padding:12px; border-radius:8px; box-shadow:0 6px 18px rgba(15,23,42,0.05); margin-bottom:12px; }
  .small{ color:#6b7280; font-size:13px; }
</style>
</head>
<body>
  <h1>Administración Orange Store</h1>

  <label>Filtrar por tienda:</label>
  <select id="filtroTienda">
    <option value="ALL">Todas</option>
    <option value="R04">R04</option>
    <option value="B15">B15</option>
    <option value="S04">S04</option>
  </select>

  <label>Desde</label>
  <input type="date" id="fechaDesde">
  <label>Hasta</label>
  <input type="date" id="fechaHasta">

  <div class="card">
    <h3>Totales</h3>
    <div class="small">Total ventas (USD,): $<span id="totalVentas">0.00</span></div>
    <div class="small">Total comisiones (Mano $): $<span id="totalComisiones">0.00</span></div>
    <div class="small">Ventas registradas: <span id="count">0</span></div>
  </div>

  <div class="card">
    <h3>Resumen por Vendedor (USD)</h3>
    <div id="resVendedores"></div>
  </div>

  <div class="card">
    <h3>Resumen por Técnico</h3>
    <div id="resTecnicos"></div>
    <div class="small">Columna <strong>Mano $</strong> = comisiones del técnico (USD).</div>
  </div>

  <h3>Listado</h3>
  <table>
    <thead>
      <tr>
        <th>Tienda</th><th>Fecha</th><th>Cliente</th><th>Concepto</th><th>Vendedor</th><th>Técnico</th><th>Mano $</th><th>Total $ (venta)</th>
      </tr>
    </thead>
    <tbody id="tabla"></tbody>
  </table>

<script>
  const $ = id => document.getElementById(id);
  const SALES_KEY = 'ventas';
  const hasFirebase = (window.firebase && firebase.firestore);
  const db = hasFirebase ? firebase.firestore() : null;

  function formatMoney(v){ return Number(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }

  async function fetchVentas(filters = {}) {
    if (hasFirebase) {
      let q = db.collection('sales').orderBy('date','desc');
      if (filters.store && filters.store !== 'ALL') q = q.where('storeId','==',filters.store);
      if (filters.from) q = q.where('date', '>=', new Date(filters.from));
      if (filters.to) { const to=new Date(filters.to); to.setHours(23,59,59,999); q = q.where('date','<=', to); }
      const snap = await q.get();
      return snap.docs.map(d => {
        const s = d.data();
        return {
          tienda: s.storeId || 'UNKNOWN',
          fecha: s.date ? (s.date.seconds ? new Date(s.date.seconds*1000).toISOString().slice(0,10) : new Date(s.date).toISOString().slice(0,10)) : '',
          cliente: s.cliente || '',
          concepto: s.concepto || '',
          vendedor: s.vendedor || '',
          tecnico: s.tecnico || '',
          manoDeObraUsd: Number(s.manoDeObraUsd || 0),
          montoVentaUsd: Number(s.montoVentaUsd || s.montoUsd || 0)
        };
      });
    } else {
      const arr = JSON.parse(localStorage.getItem(SALES_KEY) || '[]');
      return arr.map(v=>({
        tienda: v.storeId,
        fecha: v.fecha || (v.date ? new Date(v.date).toISOString().slice(0,10) : ''),
        cliente: v.cliente,
        concepto: v.concepto,
        vendedor: v.vendedor,
        tecnico: v.tecnico,
        manoDeObraUsd: Number(v.manoDeObraUsd || 0),
        montoVentaUsd: Number(v.montoVentaUsd || v.montoUsd || 0)
      })).filter(v=>{
        if (filters.store && filters.store!=='ALL' && v.tienda!==filters.store) return false;
        if (filters.from && (!v.fecha || v.fecha < filters.from)) return false;
        if (filters.to && (!v.fecha || v.fecha > filters.to)) return false;
        return true;
      });
    }
  }

  async function cargar(){
    const store = $('filtroTienda').value;
    const from = $('fechaDesde').value || null;
    const to = $('fechaHasta').value || null;
    const ventas = await fetchVentas({ store, from, to });

    // tabla
    $('tabla').innerHTML = ventas.map(v=>`
      <tr>
        <td>${v.tienda}</td>
        <td>${v.fecha}</td>
        <td>${escapeHtml(v.cliente)}</td>
        <td>${escapeHtml(v.concepto)}</td>
        <td>${escapeHtml(v.vendedor)}</td>
        <td>${escapeHtml(v.tecnico)}</td>
        <td>$${formatMoney(v.manoDeObraUsd)}</td>
        <td>$${formatMoney(v.montoVentaUsd)}</td>
      </tr>`).join('');

    // totales
    const totalVentas = ventas.reduce((s,v)=>s+v.montoVentaUsd,0);
    const totalComisiones = ventas.reduce((s,v)=>s+v.manoDeObraUsd,0);
    $('totalVentas').innerText = formatMoney(totalVentas);
    $('totalComisiones').innerText = formatMoney(totalComisiones);
    $('count').innerText = ventas.length;

    // resumen por vendedor (suma montoVentaUsd)
    const byV = {};
    ventas.forEach(v => { const k = v.vendedor || 'SIN VENDEDOR'; byV[k] = (byV[k]||0) + v.montoVentaUsd; });
    $('resVendedores').innerHTML = '<table><thead><tr><th>Vendedor</th><th>Total $</th></tr></thead><tbody>' +
      Object.keys(byV).sort((a,b)=>byV[b]-byV[a]).map(k=>`<tr><td>${escapeHtml(k)}</td><td>$${formatMoney(byV[k])}</td></tr>`).join('') +
      '</tbody></table>';

    // resumen por técnico: suma mano de obra y total ventas (opcional)
    const byT_mano = {};
    const byT_total = {};
    ventas.forEach(v => {
      const k = v.tecnico || 'SIN TÉCNICO';
      byT_mano[k] = (byT_mano[k]||0) + v.manoDeObraUsd;
      byT_total[k] = (byT_total[k]||0) + v.montoVentaUsd;
    });
    let html = '<table><thead><tr><th>Técnico</th><th>Mano $</th><th>Total $ (venta)</th></tr></thead><tbody>';
    Object.keys(byT_mano).sort((a,b)=>byT_mano[b]-byT_mano[a]).forEach(k=>{
      html += `<tr><td>${escapeHtml(k)}</td><td>$${formatMoney(byT_mano[k])}</td><td>$${formatMoney(byT_total[k])}</td></tr>`;
    });
    html += '</tbody></table>';
    $('resTecnicos').innerHTML = html;
  }

  function escapeHtml(s=''){ return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  $('filtroTienda').addEventListener('change', cargar);
  $('fechaDesde').addEventListener('change', cargar);
  $('fechaHasta').addEventListener('change', cargar);

  (function init(){ const hoy = new Date().toISOString().slice(0,10); $('fechaHasta').value = hoy; cargar(); })();
</script>
</body>
</html>
