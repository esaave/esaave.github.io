<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orange Store - Repuestos</title>
  <link rel="icon" href="logopeq.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg,#fff7ed,#ffe5d0);
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* === NAVBAR (IDÉNTICO AL INDEX) === */
    header {
      background: linear-gradient(90deg, #f97316, #ea580c);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      user-select: none;
    }
    .logo img {
      height: 42px;
      display: block;
    }
    .logo span {
      font-weight: 600;
      font-size: 18px;
      color: #fff;
    }

    nav {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.15);
      padding: 8px 16px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all .2s ease-in-out;
    }

    nav a:hover {
      background: #fff;
      color: #ea580c;
      box-shadow: 0 3px 10px rgba(255,255,255,0.3);
    }

    .menu-toggle {
      display: none;
      font-size: 26px;
      cursor: pointer;
      background: transparent;
      border: none;
      color: #fff;
    }

    /* SIDEBAR MOBILE */
    .sidebar {
      height: 100%;
      width: 0;
      position: fixed;
      top: 0;
      left: 0;
      background: #fff;
      overflow-x: hidden;
      transition: 0.3s;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      z-index: 2000;
      padding-top: 60px;
    }

    .sidebar a {
      display: block;
      padding: 14px 20px;
      text-decoration: none;
      font-size: 16px;
      color: #222;
      font-weight: 600;
      transition: 0.2s;
    }

    .sidebar a:hover {
      background: #ffe9e0;
      color: #ea580c;
    }

    .sidebar .closebtn {
      position: absolute;
      top: 12px;
      right: 20px;
      font-size: 28px;
      cursor: pointer;
      color: #333;
    }

    @media (max-width: 820px) {
      nav { display: none; }
      .menu-toggle { display: block; }
    }

    /* === CONTENIDO === */
    .rate-bar {
      text-align:center;
      margin:12px 0 2px;
      background: #fff7ed;
      padding: 8px 0;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }
    .rate-bar label {
      font-weight:600;
      color:#ea580c;
      margin-right:6px;
    }
    .rate-bar input {
      padding:6px 10px;
      border:1px solid #ccc;
      border-radius:6px;
      max-width:100px;
      font-size:15px;
    }
    .rate-bar button {
      background: #fff;
      border: 1px solid #ff7a2a;
      color: #ff7a2a;
      border-radius: 8px;
      padding: 4px 10px;
      cursor: pointer;
      font-size:13px;
      margin-left: 8px;
      transition: background .16s;
    }
    .rate-bar button:hover { background: #ffe9e0; }
    .rate-bar .tooltip {
      font-size:13px;
      color:#8a4f08;
      border-bottom:1px dotted #ea580c;
      cursor:help;
      margin-left:7px;
      background: #fff8eb;
      border-radius: 6px;
      padding: 2px 7px;
    }

    .search-area {
      margin-left: auto;
      width: min(620px, 58%);
    }
    .search-area input {
      width:100%;
      padding:10px 16px;
      border-radius:999px;
      border: none;
      font-size:15px;
      outline:none;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }

    .filters {
      display:flex;
      gap:10px;
      justify-content:center;
      padding:18px 16px 6px;
      flex-wrap:wrap;
    }
    .filter-btn {
      border:2px solid #f97316;
      background:#fff;
      color:#f97316;
      padding:8px 16px;
      border-radius:999px;
      font-weight:600;
      cursor:pointer;
      font-size:14px;
      transition:all .18s;
    }
    .filter-btn.active {
      background:linear-gradient(90deg,#f97316,#ea580c);
      color:#fff;
      box-shadow:0 6px 18px rgba(232, 88, 12, 0.18);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 22px;
      align-items: stretch;
      padding: 18px;
      max-width: 1150px;
      margin: 0 auto 40px;
      width: 100%;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 16px 16px 12px 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      transition: box-shadow .16s;
      min-height: 320px;
      max-height: 370px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      word-break: break-word;
    }
    .card:hover { box-shadow: 0 14px 38px rgba(0,0,0,0.15); }

    .card-header {
      background: #ffedd5;
      padding: 10px 14px;
      font-weight: 600;
      color: #ea580c;
      border-radius: 10px;
      margin-bottom: 10px;
      font-size: 16px;
      word-break: break-word;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-table-wrap {
      flex: 1 1 auto;
      min-height: 60px;
      max-height: 180px;
      overflow-y: auto;
      margin-bottom: 8px;
    }

    .card-table {
      width: 100%;
      border-collapse: collapse;
    }

    .card-table th, .card-table td {
      padding: 7px 10px;
      border-bottom: 1px solid #f1f1f1;
      font-size: 14px;
      word-break: break-word;
    }

    .card-table th {
      background: #fafafa;
      color: #374151;
      text-align: left;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    .card-table td { color: #222; cursor: pointer; }

    .tag {
      background: #ffeddc;
      color: #d95300;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      margin-left: 8px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.04);
      white-space: nowrap;
    }

    .spinner {
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:200px;
      grid-column:1 / -1;
    }

    .spinner div {
      width:40px;
      height:40px;
      border:4px solid #f97316;
      border-top-color:transparent;
      border-radius:50%;
      animation:spin 1s linear infinite;
    }

    @keyframes spin { to { transform:rotate(360deg); } }

    .empty {
      grid-column: 1 / -1;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      color:#b06e6e;
      font-size:16px;
      min-height:220px;
      text-align:center;
    }

    .empty .icon { font-size:36px; margin-bottom:10px; }

    .modal {
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.5);
      align-items:center;
      justify-content:center;
      z-index:2000;
    }

    .modal .content {
      width: min(420px,92%);
      background:#fff;
      border-radius:12px;
      padding:18px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,0.2);
      position:relative;
    }

    .modal h3 { color:#ff6b00; margin:4px 0 8px; }
    .modal p { margin:6px 0; color:#333; }
    .close-modal {
      position:absolute;
      top:14px;
      right:18px;
      background:transparent;
      border:none;
      font-size:22px;
      cursor:pointer;
      color:#333;
    }

    .modal .bs-row { font-size:15px; color:#ea580c; margin-bottom:8px; }
    .precio-bs { color:#ea580c; font-size:15px;}

    footer {
      text-align:center;
      padding:12px;
      font-size:13px;
      margin-top:auto;
      background:#fff7ed;
      color:#6b7280;
    }

    @media(max-width:720px){
      .grid { padding:12px; gap:14px; }
      .card { padding:11px; min-height:210px; max-height:300px; }
      .card-header { font-size:15px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">
      <img src="logo.png" alt="logo">
      <span>Orange Store</span>
    </div>
    <button class="menu-toggle" onclick="openMenu()">☰</button>
    <nav>
      <a href="index.html"><i class="fa-solid fa-house"></i> Inicio</a>
      <a href="accesorios.html"><i class="fa-solid fa-headphones"></i> Accesorios</a>
      <a href="repuestos.html"><i class="fa-solid fa-screwdriver-wrench"></i> Repuestos</a>
      <a href="#" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión</a>
    </nav>
  </header>

  <!-- Sidebar (menú móvil) -->
  <div id="sidebar" class="sidebar">
    <span class="closebtn" onclick="closeMenu()">×</span>
    <a href="index.html"><i class="fa-solid fa-house"></i> Inicio</a>
    <a href="accesorios.html"><i class="fa-solid fa-headphones"></i> Accesorios</a>
    <a href="repuestos.html"><i class="fa-solid fa-screwdriver-wrench"></i> Repuestos</a>
    <a href="#" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión</a>
  </div>

  <div class="rate-bar">
    <label for="tasaInput">Tasa Bs/$:</label>
    <input type="number" id="tasaInput" step="0.01" placeholder="Ej: 36.00">
    <span class="tooltip" title="La tasa se guarda localmente y permite ver precios en bolívares"></span>
    <button onclick="borrarTasa()">Borrar tasa</button>
    <span id="ultimaTasa" style="margin-left:10px;color:#888;font-size:13px;"></span>
  </div>

  <div class="filters" role="toolbar" aria-label="Filtros">
    <button class="filter-btn active" data-cat="all" onclick="filtrar('all',event)">Todos</button>
    <button class="filter-btn" data-cat="apple" onclick="filtrar('apple',event)">Apple</button>
    <button class="filter-btn" data-cat="samsung" onclick="filtrar('samsung',event)">Samsung</button>
    <button class="filter-btn" data-cat="pantalla" onclick="filtrar('pantalla',event)">Pantalla</button>
    <button class="filter-btn" data-cat="bateria" onclick="filtrar('bateria',event)">Batería</button>
    <button class="filter-btn" data-cat="conector" onclick="filtrar('conector',event)">Conector</button>
    <button class="filter-btn" data-cat="otros" onclick="filtrar('otros',event)">Otros</button>
  </div>

  <main class="grid" id="grid">
    <div class="spinner" id="spinner"><div></div></div>
  </main>

  <!-- Modal -->
  <div id="modal" class="modal">
    <div class="content">
      <button class="close-modal" onclick="cerrarModal()">×</button>
      <h3 id="m-modelo"></h3>
      <p id="m-marca" class="tag"></p>
      <div class="bs-row" id="m-tasa"></div>
      <div id="m-repuesto"></div>
      <p id="m-price1" class="precio"></p>
      <p id="m-price2" class="precio"></p>
      <p id="m-price2bs" class="precio-bs"></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
  <script>
    const DATA_FILE = "repuestos.json";
    const FACTOR_PRECIO2 = 1.7;
    let productos = [];
    let fuse = null;
    let filtroActivo = "all";
    function escapeHtml(str=""){ 
      return String(str).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
    }
    function detectarMarca(modelo=""){
      const m = modelo.toLowerCase();
      if(m.includes("iphone")||m.includes("apple")) return "apple";
      if(m.includes("samsung")||m.startsWith("a")||m.startsWith("j")||m.startsWith("s")) return "samsung";
      return "otros";
    }
    function detectarTipo(nombre=""){
      const n = nombre.toLowerCase();
      if(n.includes("pantalla")) return "pantalla";
      if(n.includes("bateria")) return "bateria";
      if(n.includes("conector")||n.includes("carga")) return "conector";
      return "otros";
    }
    function obtenerTasa() {
      const val = parseFloat(localStorage.getItem("tasaBS"));
      return (!isNaN(val) && val > 0) ? val : 0;
    }
    function mostrarUltimaTasa() {
      const tasa = obtenerTasa();
      document.getElementById("ultimaTasa").textContent = tasa ? `Última tasa: Bs ${tasa}` : "";
    }
    function borrarTasa() {
      localStorage.removeItem("tasaBS");
      document.getElementById("tasaInput").value = "";
      mostrarUltimaTasa();
      filtrar(filtroActivo);
    }
    fetch(DATA_FILE)
      .then(r=>r.json())
      .then(data=>{
        productos = data || [];
        fuse = new Fuse(productos, {
          keys:["modelo","repuestos.nombre"],
          threshold:0.3,
          ignoreLocation:true,
          minMatchCharLength:2
        });
        mostrarProductos(productos);
        mostrarUltimaTasa();
      })
      .catch(e=>{
        console.error(e);
        document.getElementById("grid").innerHTML = `<div class='empty'><div class='icon'>⚠️</div>Error al cargar datos</div>`;
      });

    function mostrarProductos(lista){
      const grid=document.getElementById("grid");
      grid.innerHTML="";
      if(!lista.length){
        grid.innerHTML=`<div class='empty'><div class='icon'>📦</div>No se encontraron resultados</div>`;
        return;
      }
      lista.forEach(p=>{
        const card=document.createElement("div");
        card.className="card";
        card.innerHTML=`
          <div class='card-header'>
            <span>${escapeHtml(p.modelo)}</span>
            <span class='tag'>${p.repuestos.length}</span>
          </div>
          <div class='card-table-wrap'>
            <table class='card-table'>
              <thead><tr><th>Repuesto</th><th>Precio</th></tr></thead>
              <tbody>
                ${p.repuestos.map(r=>`<tr onclick='verDetalles(${JSON.stringify(p).replace(/'/g,"&#39;")},${JSON.stringify(r).replace(/'/g,"&#39;")})'>
                  <td>${escapeHtml(r.nombre)}</td>
                  <td>$${r.precio.toFixed(2)}</td>
                </tr>`).join("")}
              </tbody>
            </table>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function verDetalles(prod, rep){
      const tasa = obtenerTasa();
      document.getElementById("m-modelo").textContent = prod.modelo;
      document.getElementById("m-marca").textContent = prod.marca || detectarMarca(prod.modelo);
      document.getElementById("m-repuesto").textContent = rep.nombre;
      document.getElementById("m-price1").textContent = `Precio 1: $${rep.precio.toFixed(2)}`;
      const precio2 = rep.precio * FACTOR_PRECIO2;
      document.getElementById("m-price2").textContent = `Precio 2: $${precio2.toFixed(2)}`;
      if(tasa>0) document.getElementById("m-price2bs").textContent = `≈ Bs ${(precio2*tasa).toFixed(2)}`;
      else document.getElementById("m-price2bs").textContent = "";
      document.getElementById("m-tasa").textContent = tasa?`Tasa actual: Bs ${tasa}`:"";
      document.getElementById("modal").style.display="flex";
    }
    function cerrarModal(){ document.getElementById("modal").style.display="none"; }

    function filtrar(cat,e){
      if(e){ document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active")); e.target.classList.add("active"); }
      filtroActivo=cat;
      let lista=productos;
      if(cat!=="all") lista=productos.filter(p=>{
        const marca=detectarMarca(p.modelo);
        const tipo=p.repuestos.some(r=>detectarTipo(r.nombre)===cat);
        return marca===cat || tipo;
      });
      mostrarProductos(lista);
    }

    function openMenu(){ document.getElementById("sidebar").style.width="230px"; }
    function closeMenu(){ document.getElementById("sidebar").style.width="0"; }

    function logout(){
      localStorage.clear();
      alert("Sesión cerrada correctamente");
      window.location.href="index.html";
    }

    document.getElementById("tasaInput").addEventListener("change", e=>{
      const val=parseFloat(e.target.value);
      if(!isNaN(val)&&val>0){
        localStorage.setItem("tasaBS",val);
        mostrarUltimaTasa();
        filtrar(filtroActivo);
      }
    });
  </script>

  <footer>
    &copy; 2025 Orange Store. Todos los derechos reservados.
  </footer>
</body>
</html>
