<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Tienda R04 — Registro de Ventas</title>
<link rel="icon" href="logopeq.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{ --accent:#ea580c; --accent-2:#f97316; --muted:#6b7280; --card:#fff; }
  html,body{ height:100%; margin:0; font-family:'Poppins',sans-serif; background: linear-gradient(180deg,#fff7f0 0%,#f7fbff 100%); color:#0f172a; }
  .wrap{ max-width:1100px; margin:26px auto; padding:14px; }
  header{ display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  header img{ height:44px; }
  .title{ font-weight:600; color:var(--accent); font-size:20px; }
  .layout{ display:grid; grid-template-columns:1fr 420px; gap:18px; }
  .card{ background:var(--card); border-radius:12px; padding:14px; box-shadow:0 10px 24px rgba(15,23,42,0.06); }
  .grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  label{ display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
  input, select, textarea{ width:100%; padding:10px; border-radius:8px; border:1px solid #eef2f6; box-sizing:border-box; font-size:14px; }
  .full{ grid-column:1 / -1; }
  .actions{ display:flex; gap:8px; margin-top:12px; }
  .btn{ background:var(--accent); color:#fff; padding:10px 12px; border-radius:8px; border:none; cursor:pointer; font-weight:600; }
  .btn.ghost{ background:transparent; border:1px solid rgba(15,23,42,0.06); color:#0f172a; }
  .small-btn{ background:var(--accent-2); color:#fff; padding:8px 10px; border-radius:8px; border:none; cursor:pointer; }
  .table-wrap{ max-height:520px; overflow:auto; margin-top:12px; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th,td{ padding:10px 8px; border-bottom:1px solid #f1f5f9; text-align:left; vertical-align:middle; }
  th{ background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#fff; position:sticky; top:0; }
  .hidden{ display:none!important; }
  .msg{ padding:8px 10px; border-radius:8px; margin-bottom:10px; display:none; }
  .msg.success{ background:#ecfccb; color:#14532d; }
  .msg.error{ background:#fee2e2; color:#7f1d1d; }
  @media (max-width:980px){ .layout{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="logopeq.png" alt="logo">
    <div class="title">Tienda <span id="storeLabel">R04</span></div>
  </header>

  <div class="layout">
    <div class="card">
      <div id="msg" class="msg"></div>

      <form id="formVenta">
        <div class="grid">
          <div><label for="fecha">Fecha</label><input type="date" id="fecha" required /></div>
          <div><label for="cashea">Cashea</label><select id="cashea"><option value="true">Sí</option><option value="false">No</option></select></div>
          <div class="full"><label for="nroFiscal">Nro. Factura Fiscal / Manual</label><input id="nroFiscal" type="text" placeholder="Opcional" /></div>
          <div class="full"><label for="nroProfit">Nro. Factura Profit</label><input id="nroProfit" type="text" placeholder="Opcional" /></div>
          <div><label>Cédula</label><div style="display:flex;gap:8px;"><select id="tipoCedula" style="width:110px;"><option>V</option><option>E</option><option>J</option></select><input id="cedula" type="text" placeholder="Número" /></div></div>
          <div><label for="cliente">Cliente *</label><input id="cliente" type="text" placeholder="Nombre del cliente" /></div>
          <div><label for="telefono">Teléfono *</label><input id="telefono" type="tel" placeholder="Ej: 04141234567" /></div>
          <div class="full"><label for="concepto">Concepto</label><input id="concepto" type="text" /></div>
          <div><label for="ordenRecepcion">Orden Recepción</label><input id="ordenRecepcion" type="text" placeholder="#12345" /></div>
          <div><label for="vendedor">Vendedor</label><input id="vendedor" type="text" /></div>
          <div><label for="tecnico">Técnico</label><input id="tecnico" type="text" /></div>
          <div><label for="manoObraUsd">Mano de obra ($)</label><input id="manoObraUsd" type="number" step="0.01" min="0" value="0" /></div>
          <div><label for="tipoPago">Tipo de pago</label><select id="tipoPago"><option>PMF</option><option>PMB</option><option>PUNTO</option><option>EFECTIVO</option><option>ZELLE</option><option>BINANCE</option></select></div>
          <div><label for="lotePuntoVenta">Lote punto venta</label><input id="lotePuntoVenta" type="text" /></div>

          <div id="bsFields">
            <div><label for="tasa">Tasa BCV</label><input id="tasa" type="number" step="0.01" min="0" /></div>
            <div style="display:flex;gap:8px;align-items:end;"><div style="flex:1"><label for="totalBs">Total (Bs)</label><input id="totalBs" type="number" step="0.01" min="0" /></div><div style="width:120px;"><button id="btnCalcUsd" type="button" class="small-btn">Calcular</button></div></div>
          </div>

          <div><label for="montoUsd">Monto $ *</label><input id="montoUsd" type="number" step="0.01" min="0" placeholder="Ej: 35.00" /></div>
          <div class="full"><label for="comentarios">Comentarios</label><textarea id="comentarios" rows="2"></textarea></div>

          <div class="full actions">
            <button id="btnGuardar" type="button" class="btn">Guardar</button>
            <button id="btnExport" type="button" class="btn ghost">Exportar</button>
            <button id="btnExportHoy" type="button" class="btn ghost">Exportar hoy</button>
            <button id="btnLimpiar" type="button" class="btn ghost">Limpiar</button>
          </div>
        </div>
      </form>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><div style="font-weight:600">Mis ventas</div><div id="countLabel" style="color:var(--muted)">0</div></div>
      <div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Factura</th><th>Cliente</th><th>Vendedor</th><th>Técnico</th><th>Mano $</th><th>Total $</th><th>Acción</th></tr></thead><tbody id="tablaVentas"></tbody></table></div>
    </div>
  </div>
</div>

<!-- SheetJS (export xlsx) -->
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

<script>
/* Configura aquí: tu Web App URL y token (no compartas el token públicamente si no quieres) */
const API_URL = 'https://script.google.com/macros/s/AKfycbwJcTI5wjpUJC4y3vM7wzJUuaSuCTB16uGBfmCGVxjHP67o6a9UTw09YYAByeLjMENN/exec';
const API_TOKEN = 'INVERSIONESORANGESTORE';

/* No necesitas cambiar el resto. Si quieres entender cada parte, te lo explico paso a paso. */
const SALES_KEY = 'ventas_local_fallback';
const urlParams = new URLSearchParams(location.search);
const STORE_PARAM = urlParams.get('store');
const DEFAULT_STORE = STORE_PARAM || 'R04';
document.getElementById('storeLabel').textContent = DEFAULT_STORE;
const $ = id => document.getElementById(id);
const DEFAULT_TASA = 1;

function formatMoney(v){ return Number(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function escapeHtml(s=''){ return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function parseYYYYMMDD(dateStr){ if(!dateStr) return null; const p=dateStr.split('-').map(Number); return new Date(Date.UTC(p[0],p[1]-1,p[2],0,0,0,0)); }
function toISODateStr(d){ if(!d) return null; if(typeof d==='string'&&d.length>=10) return d.slice(0,10); const dateObj=new Date(d); if(isNaN(dateObj)) return null; return new Date(Date.UTC(dateObj.getFullYear(),dateObj.getMonth(),dateObj.getDate())).toISOString().slice(0,10); }

function showMsg(txt, type='success'){ const m=$('msg'); if(!m) return; m.className='msg '+(type==='success'?'success':'error'); m.textContent=txt; m.style.display='block'; setTimeout(()=>m.style.display='none',3000); }

// API helpers for Google Sheets backend
async function fetchVentasViaSheets({store=null, from=null, to=null, limit=10000} = {}) {
  try {
    const q = new URL(API_URL);
    if (store) q.searchParams.set('store', store);
    if (from) q.searchParams.set('from', from);
    if (to) q.searchParams.set('to', to);
    if (limit) q.searchParams.set('limit', String(limit));
    const res = await fetch(q.toString());
    if (!res.ok) throw new Error('Error fetching ventas: ' + res.status);
    return await res.json();
  } catch (err) {
    console.warn('fetchVentasViaSheets failed, fallback to local', err);
    const arr = JSON.parse(localStorage.getItem(SALES_KEY) || '[]');
    return arr.filter(v=>v.storeId === (store||DEFAULT_STORE));
  }
}

async function guardarVentaViaSheets(venta){
  try {
    const payload = Object.assign({}, venta, { token: API_TOKEN });
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (data && data.ok) return data;
    throw new Error(data && data.error ? data.error : 'Error saving');
  } catch (err) {
    console.warn('guardarVentaViaSheets failed, saving locally', err);
    const arr = JSON.parse(localStorage.getItem(SALES_KEY) || '[]');
    arr.push(venta);
    localStorage.setItem(SALES_KEY, JSON.stringify(arr));
    return { ok: true, local: true };
  }
}

async function deleteVentaViaSheets(id){
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'delete', id, token: API_TOKEN })
    });
    const data = await res.json();
    return data;
  } catch (err) {
    console.warn('deleteViaSheets failed', err);
    let arr = JSON.parse(localStorage.getItem(SALES_KEY) || '[]');
    arr = arr.filter(x => x.id !== id);
    localStorage.setItem(SALES_KEY, JSON.stringify(arr));
    return { ok: true, local: true };
  }
}

// Simple XLSX export (SheetJS)
function exportVentasStyledXLSX(rawVentas, { filename } = {}) {
  if (!window.XLSX) return alert('SheetJS no cargado.');
  if (!Array.isArray(rawVentas) || rawVentas.length === 0) return alert('No hay ventas para exportar.');
  const groups = {};
  rawVentas.forEach(s => {
    const iso = toISODateStr(s.fecha || s.date || s.createdAt) || (new Date()).toISOString().slice(0,10);
    if (!groups[iso]) groups[iso] = [];
    groups[iso].push(s);
  });
  const wb = XLSX.utils.book_new();
  const headers = ['FECHA','NRO. FACTURA FISCAL MANUAL','NRO. FACTURA PROFIT','CASHEA','CEDULA','CLIENTE','TELEFONO','CONCEPTO','ORDEN','SUCURSAL','VENDEDOR','TECNICO','MANO $','TIPO PAGO','LOTE','TOTAL BS','TASA','MONTO $','COMENTARIOS'];
  const sortedDates = Object.keys(groups).sort();
  for (const fecha of sortedDates) {
    const rows = [headers];
    groups[fecha].forEach(s => {
      rows.push([
        toISODateStr(s.fecha || s.date || s.createdAt) || '',
        s.nroFacturaFiscalManual||'',
        s.nroFacturaProfit||'',
        (s.cashea==='true' || s.cashea===true)?'Sí':'No',
        s.cedulaCliente||'',
        s.cliente||'',
        s.telefonoCliente||'',
        s.concepto||'',
        s.ordenRecepcion||'',
        s.storeId||'',
        s.vendedor||'',
        s.tecnico||'',
        Number(s.manoDeObraUsd||0),
        s.tipoPago||'',
        s.lotePuntoVenta||'',
        s.totalBs||'',
        s.tasa||'',
        s.montoVentaUsd||s.montoUsd||0,
        s.comentarios||''
      ]);
    });
    const ws = XLSX.utils.aoa_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, fecha.replace(/-/g,''));
  }
  const ts = new Date().toISOString().replace(/[:\-T\.]/g,'').slice(0,12);
  const out = filename || `ventas_${DEFAULT_STORE}_${ts}.xlsx`;
  XLSX.writeFile(wb, out);
}
window.exportsXLSX = { exportVentasXLSX: exportVentasStyledXLSX, exportVentasSingleDay: exportVentasStyledXLSX };

// UI logic
function idGen(){ return Date.now().toString() + '-' + Math.random().toString(36).slice(2,8); }

function limpiarFormulario() {
  const form = $('formVenta');
  if (form) form.reset();
  const hoy = new Date().toISOString().slice(0, 10);
  const fechaEl = $('fecha');
  if (fechaEl) fechaEl.value = hoy;
  try { if (typeof handleTipoPagoChange === 'function') handleTipoPagoChange(); } catch(e){ console.warn(e); }
  const montoEl = $('montoUsd'); if (montoEl) montoEl.value = '';
}

function handleTipoPagoChange(){
  const tipo = $('tipoPago').value;
  const bsVisible = (tipo === 'PMF' || tipo === 'PMB' || tipo === 'PUNTO');
  const bsContainer = $('bsFields');
  if (bsVisible) bsContainer.classList.remove('hidden'); else { bsContainer.classList.add('hidden'); $('totalBs').value=''; $('tasa').value=''; }
}
$('tipoPago').addEventListener('change', handleTipoPagoChange);

$('btnCalcUsd').addEventListener('click', ()=> {
  const totalBs = parseFloat($('totalBs').value||0);
  const tasa = parseFloat($('tasa').value||0) || DEFAULT_TASA;
  if (!totalBs){ showMsg('Ingrese Total Bs', 'error'); return; }
  if (!tasa){ showMsg('Ingrese Tasa', 'error'); return; }
  const usd = +(totalBs / tasa).toFixed(2);
  if (confirm(`Equivalente sugerido: $${usd}. ¿Copiar a Monto $?`)) {
    $('montoUsd').value = usd;
    showMsg('Sugerencia copiada', 'success');
  } else showMsg('Sugerencia: $' + usd, 'success');
});

async function guardarVenta(){
  const cliente = $('cliente').value.trim();
  const telefono = $('telefono').value.trim();
  const montoUsd = parseFloat($('montoUsd').value || 0);
  if (!cliente){ showMsg('Cliente obligatorio', 'error'); return; }
  if (!telefono){ showMsg('Teléfono obligatorio', 'error'); return; }
  if (!montoUsd || montoUsd <= 0){ showMsg('Monto $ obligatorio', 'error'); return; }
  let orden = $('ordenRecepcion').value.trim();
  if (orden && !orden.startsWith('#')) orden = '#' + orden;
  const tipo = $('tipoPago').value;
  const enableBs = (tipo==='PMF' || tipo==='PMB' || tipo==='PUNTO');
  const tasa = parseFloat($('tasa').value || DEFAULT_TASA) || DEFAULT_TASA;
  const totalBs = parseFloat($('totalBs').value || 0);
  const manoUsd = parseFloat($('manoObraUsd').value || 0);
  const manoBs = (enableBs && $('tasa').value) ? +(manoUsd * tasa).toFixed(2) : 0;
  const totalBsIncluyeMano = +( (enableBs ? totalBs : 0) + manoBs ).toFixed(2);

  const fechaStr = $('fecha').value || new Date().toISOString().slice(0,10);
  const venta = {
    id: idGen(),
    fecha: fechaStr,
    nroFacturaFiscalManual: $('nroFiscal').value.trim() || '',
    nroFacturaProfit: $('nroProfit').value.trim() || '',
    cashea: $('cashea').value === 'true',
    cedulaCliente: ($('tipoCedula').value || '') + '-' + ($('cedula').value || ''),
    cliente: cliente,
    telefonoCliente: telefono,
    concepto: $('concepto').value || '',
    ordenRecepcion: orden || '',
    vendedor: $('vendedor').value || '',
    tecnico: $('tecnico').value || '',
    manoDeObraUsd: manoUsd,
    manoDeObraBs: manoBs,
    tipoPago: tipo,
    lotePuntoVenta: $('lotePuntoVenta').value || '',
    totalBs: enableBs ? totalBs : 0,
    totalBsIncluyeMano: totalBsIncluyeMano,
    tasa: enableBs ? tasa : null,
    montoVentaUsd: +montoUsd.toFixed(2),
    montoUsd: +montoUsd.toFixed(2),
    comentarios: $('comentarios').value || '',
    storeId: DEFAULT_STORE,
    createdAt: new Date().toISOString()
  };

  try {
    const res = await guardarVentaViaSheets(venta);
    if (res && res.ok) {
      showMsg(res.local ? 'Venta guardada local' : 'Venta guardada (Sheets)', 'success');
    } else {
      showMsg('No se pudo guardar', 'error');
    }
    await cargarTabla();
    limpiarFormulario();
  } catch (e) {
    console.error('Error guardarVenta:', e);
    alert('Error al guardar la venta: ' + (e && e.message ? e.message : e));
  }
}

async function cargarTabla(){
  try {
    let ventas = await fetchVentasViaSheets({ store: DEFAULT_STORE, limit: 500 });
    ventas = ventas.map(s => ({
      id: s.id || s._id || '',
      fecha: toISODateStr(s.fecha || s.date || s.createdAt) || '',
      nroFiscal: s.nroFacturaFiscalManual || '',
      nroProfit: s.nroFacturaProfit || '',
      cliente: s.cliente || '',
      vendedor: s.vendedor || '',
      tecnico: s.tecnico || '',
      manoDeObraUsd: Number(s.manoDeObraUsd || 0),
      montoVentaUsd: Number(s.montoVentaUsd || s.montoUsd || 0)
    }));

    $('tablaVentas').innerHTML = ventas.map(v => `
      <tr>
        <td>${v.fecha}</td>
        <td>${escapeHtml(v.nroFiscal || v.nroProfit || '')}</td>
        <td>${escapeHtml(v.cliente)}</td>
        <td>${escapeHtml(v.vendedor)}</td>
        <td>${escapeHtml(v.tecnico)}</td>
        <td>$${formatMoney(v.manoDeObraUsd)}</td>
        <td>$${formatMoney(v.montoVentaUsd)}</td>
        <td><button data-id="${v.id || ''}" class="btnDel" style="background:#ef4444;border:none;color:#fff;border-radius:6px;padding:6px 8px;cursor:pointer">Eliminar</button></td>
      </tr>
    `).join('');

    Array.from(document.getElementsByClassName('btnDel')).forEach(b=>{
      b.onclick = async () => {
        const id = b.getAttribute('data-id');
        if (!id){ showMsg('Id no disponible', 'error'); return; }
        if (!confirm('Eliminar esta venta? Esta acción no se puede deshacer.')) return;
        try {
          const res = await deleteVentaViaSheets(id);
          if (res && res.ok) showMsg(res.local ? 'Venta eliminada (local)' : 'Venta eliminada (Sheets)', 'success');
          else showMsg('Error eliminando', 'error');
          cargarTabla();
        } catch (err) {
          console.error(err);
          showMsg('Error eliminando', 'error');
        }
      };
    });

    $('countLabel').textContent = ventas.length;
  } catch (e) {
    console.error(e);
  }
}

// Export handlers
$('btnExport').addEventListener('click', async ()=> {
  let ventas = await fetchVentasViaSheets({ store: DEFAULT_STORE, limit: 10000 });
  if (!ventas.length){ showMsg('No hay ventas para exportar', 'error'); return; }
  exportVentasStyledXLSX(ventas, { filename: `ventas_${DEFAULT_STORE}_all.xlsx` });
});

$('btnExportHoy').addEventListener('click', async ()=>{
  const fecha = $('fecha').value || new Date().toISOString().slice(0,10);
  let ventas = await fetchVentasViaSheets({ store: DEFAULT_STORE, from: fecha, to: fecha });
  if (!ventas.length){ showMsg('No hay ventas para esa fecha', 'error'); return; }
  exportVentasStyledXLSX(ventas, { filename: `ventas_${DEFAULT_STORE}_${fecha}.xlsx` });
});

$('btnLimpiar').addEventListener('click', ()=>{ limpiarFormulario(); });
$('btnGuardar').addEventListener('click', guardarVenta);

// init
(function init(){
  const hoy = new Date().toISOString().slice(0,10); if (!$('fecha').value) $('fecha').value = hoy;
  handleTipoPagoChange();
  cargarTabla();
})();
</script>
</body>
</html>
