<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Registro de Ventas — Tienda</title>
<link rel="icon" href="logopeq.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --accent: #ea580c;
    --accent-2: #f97316;
    --muted: #6b7280;
    --card:#ffffff;
  }
  html,body{ height:100%; margin:0; font-family:'Poppins',sans-serif; color:#0f172a; }
  body{
    background: linear-gradient(180deg, #fff7f0 0%, #fffaf5 50%, #f3f7fb 100%);
    display:flex; align-items:flex-start; justify-content:center; padding:28px;
  }
  .wrap{ width:100%; max-width:1040px; }
  header{ display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  header img{ height:44px; }
  .title{ font-weight:600; color:var(--accent); font-size:20px; }
  .layout{ display:grid; grid-template-columns: 1fr 420px; gap:18px; }
  .card{ background:var(--card); border-radius:12px; padding:14px; box-shadow:0 10px 30px rgba(15,23,42,0.06); }
  form .grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  label{ font-size:13px; color:var(--muted); margin-bottom:6px; display:block; }
  input, select, textarea{ width:100%; padding:10px; border-radius:8px; border:1px solid #eef2f6; box-sizing:border-box; font-size:14px; }
  .full{ grid-column:1 / -1; }
  .actions{ display:flex; gap:8px; margin-top:10px; }
  .btn{ background:var(--accent); color:white; padding:10px 12px; border-radius:8px; border:none; cursor:pointer; font-weight:600; }
  .btn.ghost{ background:transparent; border:1px solid rgba(15,23,42,0.06); color:#0f172a; font-weight:600; }
  .small-btn{ background:var(--accent-2); color:#fff; border-radius:8px; padding:8px 10px; border:none; cursor:pointer; }
  .table-wrap{ max-height:420px; overflow:auto; margin-top:12px; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th,td{ padding:10px 8px; border-bottom:1px solid #f1f5f9; text-align:left; }
  th{ background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#fff; position:sticky; top:0; }
  .hidden{ display:none!important; }
  @media (max-width:980px){ .layout{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="logopeq.png" alt="logo">
    <div class="title">Tienda <span id="storeLabel">R04</span></div>
  </header>

  <div class="layout">
    <div class="card">
      <form id="formVenta" onsubmit="return false;">
        <div class="grid">
          <div>
            <label>Fecha</label>
            <input type="date" id="fecha" required />
          </div>
          <div>
            <label>Cashea</label>
            <select id="cashea"><option value="true">Sí</option><option value="false">No</option></select>
          </div>

          <div class="full">
            <label>Cédula</label>
            <div style="display:flex; gap:8px;">
              <select id="tipoCedula" style="width:110px;"><option>V</option><option>E</option><option>J</option></select>
              <input type="text" id="cedula" placeholder="Número" />
            </div>
          </div>

          <div>
            <label>Cliente</label>
            <input type="text" id="cliente" />
          </div>
          <div>
            <label>Teléfono</label>
            <input type="tel" id="telefono" />
          </div>

          <div class="full">
            <label>Concepto</label>
            <input type="text" id="concepto" />
          </div>

          <div>
            <label>Orden</label>
            <input type="text" id="ordenRecepcion" />
          </div>
          <div>
            <label>Vendedor</label>
            <input type="text" id="vendedor" />
          </div>

          <div>
            <label>Técnico</label>
            <input type="text" id="tecnico" />
          </div>
          <div>
            <label>Mano $</label>
            <input type="number" id="manoObraUsd" step="0.01" min="0" value="0" />
          </div>

          <div>
            <label>Tipo pago</label>
            <select id="tipoPago">
              <option>PMF</option><option>PMB</option><option>PUNTO</option>
              <option>EFECTIVO</option><option>ZELLE</option><option>BINANCE</option>
            </select>
          </div>

          <div>
            <label>Lote</label>
            <input type="text" id="lotePuntoVenta" />
          </div>

          <div id="bsFields">
            <div>
              <label>Tasa</label>
              <input type="number" id="tasa" step="0.01" min="0" />
            </div>

            <div style="display:flex; gap:8px; align-items:center;">
              <div style="flex:1">
                <label>Total (Bs)</label>
                <input type="number" id="totalBs" step="0.01" min="0" />
              </div>
              <div style="width:120px; display:flex; align-items:flex-end;">
                <button id="btnCalcUsd" type="button" class="small-btn">Calcular</button>
              </div>
            </div>
          </div>

          <div>
            <label>Monto $</label>
            <input type="number" id="montoUsd" step="0.01" min="0" required />
          </div>

          <div class="full">
            <label>Comentarios</label>
            <textarea id="comentarios" rows="2"></textarea>
          </div>

          <div class="full actions">
            <button id="btnGuardar" class="btn">Guardar</button>
            <button id="btnExport" type="button" class="btn ghost">Exportar</button>
            <button id="btnLimpiar" type="button" class="btn ghost">Limpiar</button>
          </div>
        </div>
      </form>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
        <div style="font-weight:600">Mis ventas</div>
        <div style="color:var(--muted)" id="countLabel">0</div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Fecha</th><th>Cliente</th><th>Vendedor</th><th>Mano $</th><th>Total $</th></tr></thead>
          <tbody id="tablaVentas"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  const SALES_KEY = 'ventas';
  const urlParams = new URLSearchParams(location.search);
  const STORE_PARAM = urlParams.get('store');
  const DEFAULT_STORE = STORE_PARAM || 'R04';
  document.getElementById('storeLabel').textContent = DEFAULT_STORE;

  const $ = id => document.getElementById(id);
  const hasFirebase = (window.firebase && firebase.firestore);
  const db = hasFirebase ? firebase.firestore() : null;
  const auth = hasFirebase ? firebase.auth() : null;
  const DEFAULT_TASA = 1;

  // Init date & tasa
  (function init(){
    const hoy = new Date().toISOString().slice(0,10);
    if (!$('fecha').value) $('fecha').value = hoy;
    (async ()=>{
      if (hasFirebase) {
        try {
          const id = new Date().toISOString().slice(0,10);
          const doc = await db.collection('rates').doc(id).get();
          if (doc.exists) $('tasa').value = doc.data().tasa;
          else $('tasa').value = DEFAULT_TASA;
        } catch { $('tasa').value = DEFAULT_TASA; }
      } else $('tasa').value = DEFAULT_TASA;
    })();
    handleTipoPagoChange();
    cargarTabla();
  })();

  function showMsg(txt){ const m = $('msg'); if(!m) return; m.textContent = txt; m.style.display='block'; setTimeout(()=>m.style.display='none',2500); }

  function handleTipoPagoChange(){
    const tipo = $('tipoPago').value;
    const enabled = (tipo==='PMF'||tipo==='PMB'||tipo==='PUNTO');
    const bs = $('bsFields');
    if (enabled) bs.classList.remove('hidden'); else { bs.classList.add('hidden'); $('totalBs').value=''; $('tasa').value=''; }
  }
  $('tipoPago').addEventListener('change', handleTipoPagoChange);

  $('btnCalcUsd').addEventListener('click', ()=>{
    const totalBs = parseFloat($('totalBs').value||0);
    const tasa = parseFloat($('tasa').value||0) || DEFAULT_TASA;
    if (!totalBs){ showMsg('Introduce Bs'); return; }
    if (!tasa){ showMsg('Introduce tasa'); return; }
    const usd = +(totalBs / tasa).toFixed(2);
    if (confirm(`Sugerencia: $${usd}. ¿Copiar a Monto $?`)) $('montoUsd').value = usd;
  });

  async function guardarVenta(){
    if(!$('fecha').value){ showMsg('Fecha requerida'); return; }
    const tipo = $('tipoPago').value;
    const enableBs = (tipo==='PMF'||tipo==='PMB'||tipo==='PUNTO');
    const tasa = parseFloat($('tasa').value||DEFAULT_TASA) || DEFAULT_TASA;
    const totalBs = parseFloat($('totalBs').value||0);
    const manoUsd = parseFloat($('manoObraUsd').value||0);
    const montoUsdInput = parseFloat($('montoUsd').value);
    if (!montoUsdInput || montoUsdInput<=0){ showMsg('Monto $ requerido'); return; }
    const manoBs = (enableBs && $('tasa').value) ? +(manoUsd * tasa).toFixed(2) : 0;
    const totalBsIncluyeMano = +( (enableBs ? totalBs : 0) + manoBs ).toFixed(2);

    const venta = {
      date: new Date($('fecha').value),
      fecha: $('fecha').value,
      cashea: $('cashea').value==='true',
      cedulaCliente: ($('tipoCedula').value||'') + '-' + ($('cedula').value||''),
      cliente: $('cliente').value||'',
      telefonoCliente: $('telefono').value||'',
      concepto: $('concepto').value||'',
      ordenRecepcion: $('ordenRecepcion').value||'',
      vendedor: $('vendedor').value||'',
      tecnico: $('tecnico').value||'',
      manoDeObraUsd: manoUsd,
      manoDeObraBs: manoBs,
      tipoPago: tipo,
      lotePuntoVenta: $('lotePuntoVenta').value||'',
      totalBs: enableBs ? totalBs : 0,
      totalBsIncluyeMano: totalBsIncluyeMano,
      tasa: enableBs ? tasa : null,
      montoVentaUsd: +montoUsdInput.toFixed(2),
      montoUsd: +montoUsdInput.toFixed(2),
      comentarios: $('comentarios').value||'',
      storeId: DEFAULT_STORE,
      createdAt: new Date().toISOString()
    };

    try {
      if (hasFirebase) {
        await db.collection('sales').add({
          date: firebase.firestore.Timestamp.fromDate(new Date(venta.fecha)),
          ...venta,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        showMsg('Guardado');
      } else {
        const arr = JSON.parse(localStorage.getItem(SALES_KEY)||'[]');
        arr.push(venta);
        localStorage.setItem(SALES_KEY, JSON.stringify(arr));
        showMsg('Guardado local');
      }
      cargarTabla(); limpiarFormulario();
    } catch (e){ console.error(e); showMsg('Error'); }
  }

  async function cargarTabla(){
    try {
      let ventas = [];
      if (hasFirebase){
        const q = db.collection('sales').where('storeId','==',DEFAULT_STORE).orderBy('date','desc').limit(200);
        const snap = await q.get();
        ventas = snap.docs.map(d=>{ const s=d.data(); return { fecha: s.date ? (s.date.seconds ? new Date(s.date.seconds*1000).toISOString().slice(0,10) : new Date(s.date).toISOString().slice(0,10)) : '', cliente: s.cliente||'', concepto: s.concepto||'', vendedor: s.vendedor||'', manoDeObraUsd: Number(s.manoDeObraUsd||0), montoVentaUsd: Number(s.montoVentaUsd||s.montoUsd||0) }; });
      } else {
        const arr = JSON.parse(localStorage.getItem(SALES_KEY)||'[]');
        ventas = arr.filter(v=>v.storeId===DEFAULT_STORE).slice(-200).reverse().map(v=>({ fecha: v.fecha|| (v.date? new Date(v.date).toISOString().slice(0,10):''), cliente: v.cliente, concepto: v.concepto, vendedor: v.vendedor, manoDeObraUsd: Number(v.manoDeObraUsd||0), montoVentaUsd: Number(v.montoVentaUsd||v.montoUsd||0) }));
      }
      $('tablaVentas').innerHTML = ventas.map(v=>`<tr><td>${v.fecha}</td><td>${escapeHtml(v.cliente)}</td><td>${escapeHtml(v.vendedor)}</td><td>$${formatMoney(v.manoDeObraUsd)}</td><td>$${formatMoney(v.montoVentaUsd)}</td></tr>`).join('');
      $('countLabel').textContent = ventas.length;
    } catch(e){ console.error(e); }
  }

  function formatMoney(v){ return Number(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function escapeHtml(s=''){ return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  function limpiarFormulario(){ $('formVenta').reset(); const hoy=new Date().toISOString().slice(0,10); $('fecha').value=hoy; handleTipoPagoChange(); }

  $('btnGuardar').addEventListener('click', guardarVenta);
  $('btnExport').addEventListener('click', async ()=> {
    let ventas = JSON.parse(localStorage.getItem(SALES_KEY)||'[]').filter(v=>v.storeId===DEFAULT_STORE);
    if (hasFirebase) {
      const q = await db.collection('sales').where('storeId','==',DEFAULT_STORE).orderBy('date','desc').limit(10000).get();
      ventas = q.docs.map(d=>d.data());
    }
    if (!ventas.length) return showMsg('No hay datos');
    const keys = ['fecha','cliente','vendedor','tecnico','manoDeObraUsd','totalBs','tasa','montoVentaUsd','tipoPago','comentarios'];
    const csv = [keys.join(',')].concat(ventas.map(it => keys.map(k=>`"${String((it[k]===undefined||it[k]===null)?'':it[k]).replace(/"/g,'""')}"`).join(','))).join('\n');
    const blob=new Blob([csv],{type:'text/csv'}); const link=document.createElement('a'); link.href=URL.createObjectURL(blob); link.download=`ventas_${DEFAULT_STORE}_${new Date().toISOString().slice(0,10)}.csv`; link.click();
  });

  // start
  // cargarTabla is called on init
</script>
</body>
</html>
