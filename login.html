<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orange Store - Login</title>
  <link rel="icon" href="logopeq.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Fondo animado */
    .slideshow {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }
    .slideshow img {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 2s ease-in-out;
      filter: blur(8px) brightness(0.6);
    }
    .slideshow img.active {
      opacity: 1;
      animation: zoom 20s ease-in-out infinite;
    }
    @keyframes zoom {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    /* Contenedor login */
    .login-container {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(14px);
      border-radius: 20px;
      padding: 40px 30px;
      width: min(400px, 90%);
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      color: #fff;
      animation: fadeIn 0.8s ease;
    }

    .logo {
      width: 80px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 25px;
      font-weight: 700;
    }

    .input-group {
      margin-bottom: 18px;
      text-align: left;
      position: relative;
    }

    label {
      font-size: 14px;
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
      color: #fcd9bd;
    }

    input {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      background: rgba(255, 255, 255, 0.85);
      color: #333;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
      transition: border 0.2s;
    }

    input:focus {
      border: 2px solid #ea580c;
    }

    .show-hide {
      position: absolute;
      right: 12px;
      top: 38px;
      cursor: pointer;
      color: #ea580c;
      font-size: 17px;
      user-select: none;
    }

    .remember-group {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      margin-top: -8px;
    }
    .remember-group input[type="checkbox"] {
      accent-color: #ea580c;
      margin-right: 8px;
      width: 16px;
      height: 16px;
    }
    .remember-group label {
      font-size: 13px;
      color: #fcd9bd;
      cursor: pointer;
    }

    .btn {
      margin-top: 15px;
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #f97316, #ea580c);
      color: #fff;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    }

    .error {
      margin-top: 10px;
      font-size: 14px;
      color: #ffb4a2;
      display: none;
      animation: shake 0.3s;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media(max-width: 480px) {
      .login-container {
        padding: 30px 20px;
      }
      .logo {
        width: 65px;
      }
      h1 {
        font-size: 20px;
      }
      .show-hide {
        top: 33px;
      }
    }
  </style>
</head>
<body>
  <!-- Fondo animado -->
  <div class="slideshow" aria-hidden="true">
    <img src="fondo1.jpg" class="active" alt="Fondo 1">
    <img src="fondo2.jpg" alt="Fondo 2">
    <img src="fondo3.jpg" alt="Fondo 3">
    <img src="fondo4.jpg" alt="Fondo 4">
  </div>

  <div class="login-container">
    <img src="logo.png" alt="Orange Store" class="logo">
    <h1>Iniciar Sesión</h1>

    <form autocomplete="off" onsubmit="return false;">
      <div class="input-group">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" placeholder="Ingresa tu usuario" autocomplete="username">
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Ingresa tu contraseña" autocomplete="current-password">
        <span class="show-hide" id="togglePwd">👁️</span>
      </div>

      <div class="remember-group">
        <input type="checkbox" id="rememberMe">
        <label for="rememberMe">Recuérdame</label>
      </div>

      <button class="btn" id="btnLogin">Entrar</button>
      <div id="errorMsg" class="error">Usuario o contraseña incorrectos</div>
    </form>
  </div>

  <script>
  // Fondo animado
  const slides = document.querySelectorAll(".slideshow img");
  let current = 0;
  setInterval(() => {
    slides[current].classList.remove("active");
    current = (current + 1) % slides.length;
    slides[current].classList.add("active");
  }, 10000);

  // Mostrar/Ocultar contraseña
  const togglePwd = document.getElementById("togglePwd");
  const pwdInput = document.getElementById("password");
  togglePwd.addEventListener("click", () => {
    const isHidden = pwdInput.type === "password";
    pwdInput.type = isHidden ? "text" : "password";
    togglePwd.textContent = isHidden ? "🙈" : "👁️";
  });

  // Usuarios del sistema
  const USERS = {
    "Administracion": { pass: "AdminOrange", redirect: "administracion.html" },
    "R04": { pass: "R04.CLAVE", redirect: "r04.html" },
    "B15": { pass: "B15.CLAVE", redirect: "b15.html" },
    "S04": { pass: "S04.CLAVE", redirect: "s04.html" }
  };

  let loginAttempts = parseInt(localStorage.getItem("loginAttempts") || "0");

  function login() {
    const user = document.getElementById("usuario").value.trim();
    const pass = document.getElementById("password").value.trim();
    const errorMsg = document.getElementById("errorMsg");
    const btnLogin = document.getElementById("btnLogin");

    errorMsg.style.display = "none";
    btnLogin.disabled = true;

    if (!user || !pass) {
      errorMsg.textContent = "Debes completar ambos campos";
      errorMsg.style.display = "block";
      btnLogin.disabled = false;
      return;
    }

    if (loginAttempts >= 5) {
      errorMsg.textContent = "Demasiados intentos. Espera unos minutos.";
      errorMsg.style.display = "block";
      btnLogin.disabled = false;
      return;
    }

    const u = USERS[user];
    if (u && u.pass === pass) {
      sessionStorage.setItem("logueado", "true");
      sessionStorage.setItem("rol", user);
      localStorage.setItem("loginAttempts", "0");
      if (document.getElementById("rememberMe").checked)
        localStorage.setItem("usuarioRecordado", user);
      else
        localStorage.removeItem("usuarioRecordado");
      window.location.href = u.redirect;
    } else {
      loginAttempts++;
      localStorage.setItem("loginAttempts", loginAttempts);
      errorMsg.textContent = "Usuario o contraseña incorrectos";
      errorMsg.style.display = "block";
    }

    btnLogin.disabled = false;
  }

  document.getElementById("usuario").addEventListener("keydown", e => { if (e.key === "Enter") login(); });
  document.getElementById("password").addEventListener("keydown", e => { if (e.key === "Enter") login(); });
  document.getElementById("btnLogin").addEventListener("click", login);
  </script>
</body>
</html>
